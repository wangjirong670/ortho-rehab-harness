version: "1.0.0"
domain: "中医骨伤科与康复科"
description: "骨伤/康复绝对红旗征与禁忌规则库。所有规则在投入临床辅助前需经执业医师逐条核对。"
global_negation_terms:
  - "regex:(?<!毫)无(?!力|诱因|疑|毫|法|效|故|谓|菌|痛|非|论|需|须|怪|妨|奈|聊|辜|可|所谓)"
  - "未见"
  - "未诉"
  - "否认"
  - "regex:(?<!待)(?<!未)(?<!需)(?<!不)(?<!难)排除"
  - "阴性"
  - "不伴"
  - "regex:无明显(?!诱因)"
  - "未出现"
  - "已排除"
  - "没有"
  - "并未"
  - "尚未"
  - "至今未"
  - "未曾做"
  - "未曾行"
  - "未接受"
  - "未实施"
  - "未做"
  - "regex:未行(?!走)"

rules:
  - rule_id: "RF_001"
    name: "脊髓型颈椎病/颈脊髓受压征象"
    category: "手法与物理治疗禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "踩棉花感"
        - "踩棉花"
        - "脚踩棉花"
        - "踩海绵"
        - "走路发飘"
        - "脚底发飘"
        - "步态发飘"
        - "行走不稳"
        - "下肢踩棉"
        - "脊髓受压"
        - "脊髓型颈椎病"
        - "束带感"
        - "持筷困难"
        - "筷子拿不稳"
        - "拿筷子不稳"
        - "霍夫曼征阳性"
        - "Hoffmann征阳性"
        - "病理征阳性"
        - "regex:(?:霍夫曼|Hoffmann)\\s*征?\\s*(?:阳性|\\(\\+\\)|（\\+）)"
        - "regex:病理征\\s*(?:阳性|\\(\\+\\)|（\\+）)"
      supporting_any:
        - "扣纽扣不灵"
        - "扣扣子费劲"
        - "扣扣子不灵"
        - "系扣子费劲"
        - "系扣子不利索"
        - "系扣子困难"
        - "持物易落"
        - "精细动作障碍"
        - "肌张力增高"
        - "腱反射亢进"
    negation_guards:
      - "无踩棉花感"
      - "否认踩棉花"
      - "病理征阴性"
      - "Hoffmann征阴性"
      - "霍夫曼征阴性"
    contraindicated_actions:
      - "颈椎旋转扳法/高速低幅整复"
      - "暴力斜扳或在家自行掰脖子复位"
      - "大重量颈椎牵引"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "疑似脊髓型颈椎病/颈脊髓受压，严禁任何颈椎旋转扳法、暴力正骨或盲目牵引，存在高位截瘫风险！建议立即完善颈椎 MRI 并转诊脊柱骨科评估。"
    clinical_rationale: "颈脊髓已处于临界受压状态，旋转或暴力复位可瞬间加重脊髓剪切与缺血性损伤，诱发急性脊髓损伤甚至截瘫。"
    references:
      - "《中医骨伤科学》（全国中医药行业高等教育'十四五'规划教材，第5版，2021年）- 第八章 筋伤 颈椎病节"
      - "中国康复医学会《颈椎病诊治与康复指南》（2018版）- 脊髓型颈椎病手法治疗禁忌节"

  - rule_id: "RF_002"
    name: "马尾综合征疑似征象"
    category: "急诊转诊红线"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "鞍区麻木"
        - "会阴区麻木"
        - "会阴麻木"
        - "会阴部麻木"
        - "会阴部感觉减退"
        - "大小便失禁"
        - "二便失禁"
        - "尿失禁"
        - "大便失禁"
        - "二便功能障碍"
        - "大小便功能障碍"
        - "尿潴留"
        - "排尿困难"
        - "小便费力"
        - "排尿费力"
        - "解不出尿"
        - "尿不出来"
        - "尿不出"
        - "小便解不出"
        - "小便解不出来"
        - "足下垂"
        - "马尾综合征"
        - "regex:(?:屁股|臀部)坐板凳.{0,4}麻"
        - "regex:屁股(?:发木|麻木)(?!.{0,30}(?:大小便正常|二便正常))"
        - "regex:(?:会阴|鞍区|肛周).{0,4}(?:麻木|发木|没知觉|感觉减退|感觉丧失)"
      supporting_any:
        - "双下肢进行性无力"
        - "腰椎间盘巨大突出"
        - "肛门括约肌松弛"
    negation_guards:
      - "二便正常"
      - "大小便正常"
      - "无大小便失禁"
      - "无鞍区麻木"
      - "否认二便异常"
    contraindicated_actions:
      - "腰椎斜扳/踩跷/重手法推拿"
      - "单纯保守理疗观察延误急诊减压"
    recommended_action: "EMERGENCY_REFER"
    clinical_alert: "高度怀疑马尾综合征（骨科急诊红旗）！严禁推拿正骨或保守观察延误，须立即急诊脊柱外科评估并尽快行腰椎 MRI 与手术减压评估。"
    clinical_rationale: "马尾神经持续受压超过黄金时间窗易导致不可逆的括约肌功能与下肢运动功能丧失。"
    references:
      - "中华医学会骨科学分会《腰椎间盘突出症诊疗指南》（2020版）- 马尾综合征急诊减压指征节"
      - "胥少汀、葛宝丰、徐印坎主编《实用骨科学》（第4版，2012年）- 脊柱外科急症与马尾损伤章节"

  - rule_id: "RF_003"
    name: "疑似急性骨折或关节脱位未排除"
    category: "手法与负重禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "骨擦音"
        - "骨擦感"
        - "异常活动"
        - "关节畸形"
        - "方肩畸形"
        - "弹性固定"
        - "疑似骨折"
        - "怀疑骨折"
        - "高处坠落"
        - "车祸外伤"
      supporting_any:
        - "局部剧烈压痛"
        - "纵向叩击痛阳性"
        - "无法负重行走"
        - "明显肿胀瘀斑"
    negation_guards:
      - "未见骨折线"
      - "排除骨折"
      - "X线未见骨折"
      - "无畸形"
      - "无骨擦感"
      - "regex:(?:\\d+|[一二两三四五六七八九十半多])\\s*(?:年|个?月)前.{0,6}(?:高处坠落|车祸外伤)"
      - "regex:(?:既往|陈旧性?).{0,4}(?:高处坠落|车祸外伤)"
      - "regex:(?:高处坠落|车祸外伤)史.{0,12}(?:已痊愈|已愈|愈合|陈旧)"
    contraindicated_actions:
      - "未经影像学确诊的推拿理筋与揉按"
      - "非专业环境盲目复位或强行负重"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "存在急性骨折或关节脱位高危征象！影像学排除前严禁推拿按摩、盲目拉拽复位或尝试负重，须先行临时制动并完善 X 线/CT 检查。"
    clinical_rationale: "未明确骨折线与移位情况前施用手法可导致骨折再移位、损伤伴行血管神经或使闭合性骨折转为开放性骨折。"
    references:
      - "《中医骨伤科学》（全国中医药行业高等教育'十四五'规划教材，第5版，2021年）- 第三章 骨折概论与急救制动原则"

  - rule_id: "RF_004"
    name: "疑似脊柱或骨骼恶性肿瘤/骨转移"
    category: "手法与理疗禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "夜间静息痛"
        - "骨转移"
        - "病理性骨折"
        - "脊柱肿瘤"
        - "骨肿瘤"
        - "溶骨性破坏"
      supporting_any:
        - "不明原因消瘦"
        - "体重明显下降"
        - "既往肿瘤史"
        - "乳腺癌病史"
        - "肺癌病史"
        - "前列腺癌病史"
        - "平卧痛不缓解"
    negation_guards:
      - "无夜间痛"
      - "否认肿瘤病史"
      - "排除骨转移"
    contraindicated_actions:
      - "脊柱整复、重手法推拿与局部强刺激理疗"
      - "局部深部透热理疗（如短波/超短波/热敷）"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "提示骨肿瘤或脊柱骨转移红旗征象！严禁手法整复及局部深部热疗，存在病理性骨折及加速播散风险，须尽快完善 MRI/骨扫描与肿瘤骨科评估。"
    clinical_rationale: "骨质破坏区力学强度显著下降，外力整复极易诱发病理性骨折或脊髓压迫。"
    references:
      - "北美脊柱学会（NASS）《下腰痛临床诊疗指南》/ 中华医学会骨科学分会《中国急/慢性非特异性腰背痛诊疗专家共识》（2016版）- 恶性肿瘤红旗筛查标准"

  - rule_id: "RF_005"
    name: "疑似脊柱/关节化脓性感染或骨关节结核"
    category: "感染性红旗禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "化脓性关节炎"
        - "化脓性脊柱炎"
        - "脊柱结核"
        - "骨结核"
        - "高热寒战"
        - "椎间隙感染"
      supporting_any:
        - "低热盗汗"
        - "发热"
        - "关节红肿剧痛"
        - "CRP显著升高"
        - "血沉显著增快"
        - "白细胞升高"
        - "近期脊柱穿刺史"
    negation_guards:
      - "无发热"
      - "否认结核病史"
      - "排除感染"
      - "体温正常"
    contraindicated_actions:
      - "局部推拿按摩、拔罐放血与热敷理疗"
      - "未排除感染前的关节腔激素封闭注射"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "疑似骨关节化脓性感染或结核！严禁推拿、热敷及盲目局部封闭，须尽快完善血常规/CRP/ESR、影像学及感染/骨科专科处理。"
    clinical_rationale: "推拿与热疗可促进局部血运导致感染扩散甚至脓毒血症，盲目激素封闭会掩盖并急剧加重感染。"
    references:
      - "胥少汀、葛宝丰、徐印坎主编《实用骨科学》（第4版，2012年）- 骨与关节化脓性感染及骨结核诊疗原则章节"

  - rule_id: "RF_006"
    name: "疑似下肢深静脉血栓（DVT）"
    category: "术后与制动康复红线"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "深静脉血栓"
        - "DVT"
        - "单侧小腿肿胀"
        - "小腿粗了一圈"
        - "小腿发胀"
        - "小腿肿胀"
        - "腓肠肌压痛"
        - "一捏小腿肚就疼"
        - "Homans征阳性"
        - "霍曼征阳性"
        - "regex:小腿(?:粗了一圈|发胀|肿胀|发硬)"
        - "regex:捏小腿肚.{0,3}(?:疼|痛)"
      supporting_any:
        - "骨科术后"
        - "长期卧床"
        - "石膏制动"
        - "皮温升高"
        - "D-二聚体显著升高"
        - "下肢周径明显增粗"
    negation_guards:
      - "排除DVT"
      - "下肢血管彩超未见血栓"
      - "无深静脉血栓"
      - "Homans征阴性"
    contraindicated_actions:
      - "患肢推拿按摩、揉捏腓肠肌"
      - "下肢间歇充气加压（气压治疗）与剧烈主动活动"
    recommended_action: "EMERGENCY_REFER"
    clinical_alert: "高度怀疑下肢深静脉血栓（DVT）！严禁按摩揉捏患肢或使用气压治疗，以免血栓脱落引发致命性肺栓塞（PE），须立即制动并急查下肢深静脉彩超与 D-二聚体。"
    clinical_rationale: "机械挤压或剧烈肌肉收缩极易促使不稳定静脉血栓脱落，随血流进入肺动脉造成急性肺栓塞。"
    references:
      - "中华医学会骨科学分会《中国骨科大手术静脉血栓栓塞症预防指南》（2016版）- 术后 DVT 筛查与物理禁忌章节"

  - rule_id: "RF_007"
    name: "前交叉韧带（ACL）重建术后早期过载红线"
    category: "术后康复分期保护"
    severity: "high"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "ACL重建术后"
        - "前交叉韧带重建术后"
        - "前叉术后"
        - "前交叉韧带重建"
        - "ACL重建"
        - "regex:前叉(?:韧带)?(?:重建|术后)"
      supporting_any:
        - "术后1周"
        - "术后2周"
        - "术后3周"
        - "术后4周"
        - "提前弃拐"
        - "全负重"
        - "开链抗阻伸膝"
        - "跑步"
        - "急停变向"
        - "深蹲"
        - "合并半月板缝合"
    negation_guards:
      - "术后1年"
      - "术后2年"
      - "术后两年以上"
      - "术后9个月已通过重返运动测试"
      - "regex:术后\\s*(?:[1-9]\\d*|[一二两三四五六七八九十])\\s*年(?:以上|余)?"
      - "regex:术后\\s*(?:9|1[0-9]|2[0-9]|3[0-9])\\s*个月"
      - "regex:(?:[1-9]\\d*|[一二两三四五六七八九十])\\s*年前.{0,6}(?:ACL|前交叉韧带|前叉)"
    contraindicated_actions:
      - "未经手术医师许可提前弃拐全负重（尤其合并半月板缝合时）"
      - "术后早期大角度（0°-30°末段）大阻力开链伸膝训练"
      - "早期跑跳、急停变向与高冲击运动"
    recommended_action: "STOP_AND_VERIFY_PROTOCOL"
    clinical_alert: "处于 ACL 重建术后移植物韧带化脆弱窗口期！禁止擅自提前弃拐全负重、早期大阻力开链伸膝或跑跳变向（若合并半月板缝合更须严格限制屈曲与负重），请严格核对手术医师的阶段性康复方案。"
    clinical_rationale: "移植物早期经历坏死与再血管化重塑，过高前向剪切力或过早负荷易导致移植物松弛甚至断裂。"
    references:
      - "中华医学会运动医疗分会《前交叉韧带重建术后康复临床实践指南》（2022版）- 分期负荷保护原则章节"

  - rule_id: "RF_008"
    name: "全髋关节置换术（THA）后外侧入路脱位禁忌体位"
    category: "术后康复分期保护"
    severity: "high"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "全髋关节置换"
        - "髋关节置换术后"
        - "THA术后"
        - "人工股骨头置换"
      supporting_any:
        - "后外侧入路"
        - "翘二郎腿"
        - "坐矮凳"
        - "蹲便"
        - "弯腰捡东西"
        - "屈髋大于90度"
        - "内收内旋"
    negation_guards:
      - "未行髋关节置换"
    contraindicated_actions:
      - "屈髋超过 90°（如坐矮凳、深蹲、弯腰系鞋带）"
      - "患肢内收越过身体中线（如翘二郎腿、侧卧双腿间未夹枕）"
      - "患髋大幅度内旋动作"
    recommended_action: "CAUTION_AND_PROTECT"
    clinical_alert: "全髋关节置换术后（尤其后外侧入路早期）存在假体后脱位高风险！严禁屈髋 >90°、内收过中线（翘二郎腿）及内旋动作，坐姿须使用增高垫并保持双膝分开。"
    clinical_rationale: "术后早期后方关节囊与短外旋肌群尚未牢固愈合，屈髋内收内旋复合动作易使股骨头假体向后脱出髋臼。"
    references:
      - "中华医学会骨科学分会《中国髋、膝关节置换术加速康复围术期管理专家共识》（2016版）- 体位管理与防脱位章节"

  - rule_id: "RF_009"
    name: "重度骨质疏松或脊柱压缩骨折高风险禁暴力整复"
    category: "手法与物理治疗禁忌"
    severity: "high"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "重度骨质疏松"
        - "严重骨质疏松"
        - "T值≤-2.5"
        - "骨密度T值-3"
        - "regex:T\\s*值?\\s*[:：=≤＜<]?\\s*-\\s?[2-9](?:\\.\\d+)?"
        - "椎体压缩骨折"
        - "脆性骨折"
      supporting_any:
        - "高龄"
        - "绝经后"
        - "长期使用激素"
        - "腰背痛"
        - "想做正骨"
        - "斜扳"
    negation_guards:
      - "骨密度正常"
      - "无骨质疏松"
    contraindicated_actions:
      - "脊柱高速低幅整脊、腰椎斜扳与踩跷手法"
      - "暴力按压脊柱棘突或过度脊柱屈曲卷腹训练"
    recommended_action: "STOP_AND_MODIFY_PLAN"
    clinical_alert: "存在重度骨质疏松/脆性骨折高风险！严禁脊柱斜扳、踩跷及任何暴力正骨手法，也应避免剧烈屈曲卷腹，须改用轻柔理筋及规范抗骨质疏松治疗。"
    clinical_rationale: "骨小梁稀疏变脆时，常规整脊扭矩即可诱发医源性肋骨骨折或胸腰椎压缩性骨折。"
    references:
      - "中华医学会骨质疏松和骨矿盐疾病分会《原发性骨质疏松症诊疗指南》（2022版）- 第五节 运动与康复安全注意"

  - rule_id: "RF_010"
    name: "热痹急性期/急性痛风关节红肿热痛禁重灸热敷"
    category: "中医辨证治疗禁忌"
    severity: "high"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "关节红肿热痛"
        - "局部灼热"
        - "皮温明显升高"
        - "急性痛风"
        - "热痹"
        - "风湿热痹"
        - "肿得发亮"
        - "摸着发烫"
        - "红肿灼热"
        - "regex:(?:肿得发亮|摸着发烫|红肿发烫)"
      supporting_any:
        - "剧痛拒按"
        - "钻心疼"
        - "得冷则舒"
        - "舌红苔黄腻"
        - "舌苔又黄又厚"
        - "尿酸升高"
        - "第一跖趾关节红肿"
    negation_guards:
      - "局部不红不热"
      - "不红不热"
      - "不发烫"
      - "皮温正常"
      - "无红肿热痛"
      - "得温痛减"
    contraindicated_actions:
      - "局部艾灸/重灸、热敷、红外线/烤灯热疗"
      - "强行揉按患处及辛温燥热膏药外敷"
    recommended_action: "STOP_AND_MODIFY_PLAN"
    clinical_alert: "当前表现符合热痹/急性炎症充血期（红肿热痛）！严禁局部艾灸、热敷、烤灯或辛温药膏外敷（热证用热反助火毒、加重渗出剧痛），宜制动抬高、必要时冷敷并核查痛风/感染指标。"
    clinical_rationale: "中医“热者寒之”，现代医学急性渗出期局部加温会扩张血管、加重组织水肿与炎性介质释放。"
    references:
      - "《中医骨伤科学》（全国中医药行业高等教育'十四五'规划教材，第5版，2021年）- 痹证（风湿热痹）辨证施治原则章节"
      - "中华医学会内分泌学分会《中国高尿酸血症与痛风诊疗指南》（2019版）- 急性期非药物处理章节"

  - rule_id: "RF_011"
    name: "脊柱融合内固定术后禁旋转斜扳复位"
    category: "术后与内固定手法禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "颈椎前路融合"
        - "颈椎前路减压植骨融合内固定"
        - "ACDF"
        - "脊柱内固定"
        - "脊柱融合"
        - "椎体融合"
        - "椎弓根螺钉"
        - "钛板螺钉"
        - "颈椎内固定"
        - "腰椎内固定"
      supporting_any:
        - "旋转斜扳"
        - "旋转复位"
        - "扳法"
        - "正骨"
        - "咔嚓"
        - "落枕"
    negation_guards:
      - "未行手术"
      - "无内固定"
      - "未行内固定"
      - "无手术史"
    contraindicated_actions:
      - "颈椎/脊柱旋转斜扳与高速低幅整复复位"
      - "暴力扳动融合节段及其邻近退变节段"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "患者存在脊柱融合/内固定手术史！严禁施用任何颈椎或脊柱旋转斜扳、咔嚓正骨复位手法，暴力旋转扭矩可致内固定松动断裂、植骨不稳或邻近节段脊髓损伤！"
    clinical_rationale: "融合节段失去生理活动度后应力集中于邻近节段，高速旋转扳法易产生异常剪切力危及脊髓及内固定系统。"
    references:
      - "中国康复医学会《颈椎病诊治与康复指南》（2018版）- 颈椎术后康复与手法安全禁忌章节"
      - "《实用骨科学》（第4版，2012年）- 颈椎前路减压融合术后并发症与邻近节段退变章节"

  - rule_id: "RF_012"
    name: "强直性脊柱炎/竹节样脊柱禁暴力手法整复"
    category: "脊柱结构脆性手法禁忌"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "强直性脊柱炎"
        - "竹节样脊柱"
        - "竹节椎"
        - "竹节样改变"
        - "脊柱骨性强直"
      supporting_any:
        - "斜扳"
        - "踩跷"
        - "正骨"
        - "暴力手法"
        - "颈背僵直"
        - "HLA-B27阳性"
    negation_guards:
      - "排除强直性脊柱炎"
      - "无强直性脊柱炎"
      - "否认强直性脊柱炎"
    contraindicated_actions:
      - "脊柱高速低幅整脊、旋转斜扳、踩跷及暴力牵拉"
      - "强行扳动纠正脊柱强直畸形"
    recommended_action: "STOP_AND_REFER"
    clinical_alert: "强直性脊柱炎/竹节样脊柱绝对禁止任何脊柱暴力整复、斜扳与踩跷手法！强直脊柱宛如脆性长骨，轻微外力即可致致命性脊柱骨折与截瘫！"
    clinical_rationale: "脊柱韧带骨化融合伴骨质疏松导致力学顺应性丧失，应力高度集中，极易发生经椎体或经椎间隙不稳定骨折（胡萝卜棒骨折）。"
    references:
      - "中华医学会风湿病学分会《强直性脊柱炎诊疗规范》（2022版）- 脊柱骨折预防与康复禁忌章节"
      - "《实用骨科学》（第4版，2012年）- 强直性脊柱炎并发脊柱骨折章节"

  - rule_id: "RF_013"
    name: "疑似急性肺栓塞（PE）危急征象"
    category: "急诊转诊红线"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "肺栓塞"
        - "急性PE"
        - "呼吸困难伴咯血"
        - "突发胸痛伴呼吸困难"
        - "regex:(?:DVT|深静脉血栓|术后|长期卧床|制动)[^。！？；\\n]{0,30}?(?<!无)(?<!未见)(?<!否认)(?:突发胸痛|胸痛|呼吸困难|气促|喘憋|咯血|晕厥)"
        - "regex:(?:突发胸痛|呼吸困难|咯血)[^。！？；\\n]{0,30}?(?:DVT|深静脉血栓|血栓脱落|D-二聚体|小腿肿胀)"
      supporting_any:
        - "突发胸痛"
        - "呼吸困难"
        - "咯血"
        - "D-二聚体升高"
        - "血氧饱和度下降"
        - "深静脉血栓"
        - "长期卧床"
    negation_guards:
      - "无胸痛"
      - "无呼吸困难"
      - "无咯血"
      - "排除肺栓塞"
      - "排除PE"
    contraindicated_actions:
      - "继续康复训练、下床活动或患肢按摩"
      - "按普通肌肉拉伤或心肺劳累保守观察延误急诊抢救"
    recommended_action: "EMERGENCY_REFER"
    clinical_alert: "高度怀疑急性肺栓塞（PE）危及生命！立即停止一切康复活动并绝对卧床制动，马上呼叫急救/转诊急诊抢救室完善 CTPA 与血气分析！"
    clinical_rationale: "DVT 血栓脱落阻塞肺动脉主干或分支可迅速导致急性右心衰、低氧血症甚至猝死。"
    references:
      - "中华医学会呼吸病学分会《肺血栓栓塞症诊治与预防指南》（2018版）- 急性 PE 危险分层与急诊处置章节"
      - "中华医学会骨科学分会《中国骨科大手术静脉血栓栓塞症预防指南》（2016版）- PE 急症识别章节"

  - rule_id: "RF_014"
    name: "颈部手法后疑似椎动脉夹层/后循环缺血征象"
    category: "急诊转诊红线"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "椎动脉夹层"
        - "颈动脉夹层"
        - "突发眩晕伴复视"
        - "构音障碍伴共济失调"
        - "regex:(?:扳脖子|旋转复位|(?:颈部|颈椎|脖子)(?:手法|推拿|正骨|按摩|扳法|整脊)|(?:推拿|按摩|正骨|扳法)(?:颈部|颈椎|脖子)|正骨|整脊)(?:[^。！？\\n]{0,25}?[，；])?(?:(?!(?:(?<!毫)无(?!力|诱因|疑|毫|法|效|故|谓|菌|痛|非|论|需|须|怪|妨|奈|聊|辜|可|所谓)|未见|未诉|未出现|并未|尚未|否认|没有|排除))[^，。！？；\\n]){0,25}?(?<![无未没否])(?<!未见)(?<!未诉)(?<!否认)(?<!没有)(?:突发眩晕|剧烈眩晕|眩晕|突发剧烈枕颈痛|剧烈枕颈痛|枕颈痛|颈枕部剧痛|枕部剧痛|剧烈头痛|复视|走路不稳|行走不稳|步态不稳|共济失调|构音障碍|吞咽困难|饮水呛咳|跌倒发作|偏身麻木|一过性黑朦)"
      supporting_any:
        - "眩晕"
        - "复视"
        - "走路不稳"
        - "步态不稳"
        - "共济失调"
        - "构音障碍"
        - "吞咽困难"
        - "饮水呛咳"
        - "恶心呕吐"
        - "枕颈痛"
        - "颈枕部剧痛"
    negation_guards:
      - "无眩晕"
      - "无复视"
      - "排除椎动脉夹层"
    contraindicated_actions:
      - "再次施用颈部推拿、旋转扳法或颈椎牵引"
      - "按普通落枕或颈性眩晕居家观察延误卒中绿色通道"
    recommended_action: "EMERGENCY_REFER"
    clinical_alert: "高度警惕颈部手法诱发椎动脉夹层或后循环卒中！严禁再次颈部按摩牵引，立即启动卒中急诊绿色通道并完善头颈 CTA/MRA！"
    clinical_rationale: "颈部高速旋转过伸可撕裂椎动脉内膜形成壁内血肿或血栓栓塞，导致延髓/小脑急性梗死。"
    references:
      - "中华医学会神经病学分会《中国颈部动脉夹层诊治指南》（2015版）- 创伤/手法相关椎动脉夹层章节"
      - "《中国急性缺血性脑卒中诊治指南》（2023版）- 急诊血管评估章节"

  - rule_id: "RF_015"
    name: "进行性运动功能缺损/急性肌力恶化"
    category: "急诊转诊红线"
    severity: "critical"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "进行性运动功能缺损"
        - "进行性肌力下降"
        - "进行性肌力减退"
        - "双下肢进行性无力"
        - "肌力进行性下降"
        - "急性瘫痪"
        - "肢体瘫痪"
        - "regex:(?:肌力|运动功能)[^，。；\\n]{0,8}?(?:进行性|急剧|快速|持续)(?:下降|减退|恶化|丧失)"
        - "regex:进行性[^，。；\\n]{0,6}?(?:肌力下降|肌力减退|运动障碍|无力加重)"
      supporting_any:
        - "足下垂"
        - "持物脱落"
        - "无法站立"
        - "肌肉萎缩"
    negation_guards:
      - "肌力正常"
      - "无肌力下降"
      - "无进行性无力"
      - "肌力5级"
    contraindicated_actions:
      - "单纯保守推拿理疗观察延误神经减压评估"
      - "高负荷抗阻肌力训练"
    recommended_action: "EMERGENCY_REFER"
    clinical_alert: "存在进行性运动功能缺损/急性肌力恶化红旗征象！提示脊髓或神经根进行性压迫缺血，严禁单纯保守理疗观察，须立即急诊脊柱外科/神经科评估手术减压指征。"
    clinical_rationale: "运动神经元传导束持续受压超过临界时间将导致不可逆轴索变性与永久性瘫痪。"
    references:
      - "中华医学会骨科学分会《腰椎间盘突出症诊疗指南》（2020版）- 进行性神经功能缺损急诊指征章节"
      - "《实用骨科学》（第4版，2012年）- 急性脊髓与周围神经压迫症处理原则章节"

  - rule_id: "RF_016"
    name: "妊娠期骨伤理疗、手法与用药禁忌"
    category: "特殊人群理疗与用药禁忌"
    severity: "high"
    review_status: "draft_for_clinician_review"
    trigger_symptoms:
      required_any:
        - "妊娠期"
        - "怀孕"
        - "孕期"
        - "孕妇"
        - "早孕"
        - "中晚孕"
        - "regex:妊娠\\s*\\d+\\s*周"
      supporting_any:
        - "腰骶部针灸"
        - "合谷"
        - "三阴交"
        - "活血化瘀"
        - "NSAIDs"
        - "布洛芬"
        - "X线"
        - "拔罐"
        - "电针"
    negation_guards:
      - "未孕"
      - "非妊娠期"
      - "排除妊娠"
      - "否认怀孕"
    contraindicated_actions:
      - "腰骶部及腹部深部热疗、电针、重手法扳法及合谷/三阴交等妊娠禁针穴位刺激"
      - "活血破血类中药（如三七/红花/麝香膏药）与妊娠禁用口服 NSAIDs"
      - "非必要电离辐射（X线/CT）暴露"
    recommended_action: "STOP_AND_MODIFY_PLAN"
    clinical_alert: "患者处于妊娠期！严禁腰骶腹部重手法整复、深部透热、电针（及合谷/三阴交/昆仑等妊娠禁忌穴），禁用活血破血中药及妊娠期禁忌 NSAIDs，治疗须经产科与骨伤科共同评估。"
    clinical_rationale: "强刺激穴位、腹部腰骶手法及活血药物可诱发子宫平滑肌收缩导致流产或早产，孕期 NSAIDs 可致胎儿动脉导管早闭及肾损害。"
    references:
      - "《中华人民共和国药典》（2020年版 一部）- 妊娠禁用与慎用中药通则"
      - "《针灸学》（全国中医药行业高等教育'十四五'规划教材，第5版，2021年）- 针灸禁忌与妊娠期禁针穴位章节"
      - "美国 FDA / 中国《妊娠期与哺乳期临床用药指导原则》（2021版）- 非甾体抗炎药妊娠晚期警示"
