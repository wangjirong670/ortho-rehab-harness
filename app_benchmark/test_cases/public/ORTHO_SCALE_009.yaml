dimension: "tcm_syndrome_and_tools"
risk_level: "medium"
review_status: "draft_for_clinician_review"
patient_profile: "54岁女性，颈椎术后随访，提供术前与术后颈椎JOA 17分制各子项得分，要求精确计算总分、分级及Hirabayashi改善率"
