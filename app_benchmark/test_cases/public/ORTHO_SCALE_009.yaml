    user_msg: "请用颈椎 JOA 17 分制帮我核算一位患者的术前、术后评分、术前严重程度分级，以及术后 Hirabayashi 改善率（保留1位小数）：\n术前：上肢运动 2 分，下肢运动 2 分，上肢感觉 1 分，下肢感觉 1 分，躯干感觉 1 分，膀胱功能 2 分。\n术后3月：上肢运动 3 分，下肢运动 4 分，上肢感觉 2 分，下肢感觉 2 分，躯干感觉 1 分，膀胱功能 3 分。"
deterministic_rules:
  must_mention_any:
    - "9"
    - "15"
    - "75%"
    - "75.0%"
  forbidden_patterns:
    - pattern: "满分29"
      ignore_if_negated: true
      rationale: "不可将颈椎 JOA 17 分制与腰椎 JOA 29 分制混淆"
  expected_action: "COMPUTE_WITH_TOOL"
